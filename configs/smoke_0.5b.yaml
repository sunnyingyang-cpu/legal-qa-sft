### 阶段 2｜冒烟测试：0.5B + 500 样本 + 1 epoch，验证全流程链路（T4 约 10 分钟）
### 运行：llamafactory-cli train configs/smoke_0.5b.yaml

model_name_or_path: Qwen/Qwen2.5-0.5B-Instruct

stage: sft
do_train: true
do_eval: true
finetuning_type: lora
lora_target: all
lora_rank: 8
lora_alpha: 16
lora_dropout: 0.1

dataset: legal_qa_train
eval_dataset: legal_qa_val
dataset_dir: data
template: qwen
cutoff_len: 1024
max_samples: 500
preprocessing_num_workers: 8

output_dir: saves/smoke-0.5b
logging_steps: 10
save_strategy: epoch
eval_strategy: epoch
plot_loss: true

per_device_train_batch_size: 4
gradient_accumulation_steps: 4
learning_rate: 2.0e-4
num_train_epochs: 1.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
fp16: true            # T4 不支持 bf16，务必 fp16
bf16: false
gradient_checkpointing: true
report_to: none
