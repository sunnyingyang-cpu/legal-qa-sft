### 阶段 4.5｜鲁棒性推理（数据由 eval/robustness.py 生成）
### 运行：llamafactory-cli train configs/infer_robustness.yaml

model_name_or_path: Qwen/Qwen2.5-1.5B-Instruct
adapter_name_or_path: saves/qwen2.5-1.5b-lora
finetuning_type: lora
template: qwen

predict_with_generate: true
do_predict: true
dataset: legal_qa_robustness
dataset_dir: data
cutoff_len: 1024
max_new_tokens: 512
temperature: 0.1
top_p: 0.9
per_device_eval_batch_size: 8
fp16: true

output_dir: results/ft-1.5b-robust
report_to: none
